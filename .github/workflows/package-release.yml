name: Package Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    container:
      image: rocker/shiny:4.5.3

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches DESCRIPTION version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DESCRIPTION_VERSION="$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "DESCRIPTION version: ${DESCRIPTION_VERSION}"
          echo "Tag version: ${TAG_VERSION}"

          if [ -z "${DESCRIPTION_VERSION}" ]; then
            echo "::error::Could not read Version from DESCRIPTION."
            exit 1
          fi

          if [ "${DESCRIPTION_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match DESCRIPTION version (${DESCRIPTION_VERSION})."
            exit 1
          fi

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libuv1-dev

      - name: Install renv and restore packages
        run: |
          R -e "
          if (!require('renv')) install.packages('renv')
          renv::lockfile_modify(repos = c(CRAN = 'https://packagemanager.posit.co/cran/latest')) |> renv::lockfile_write()
          renv::restore(confirm = FALSE)
          "

      - name: Build source package
        run: |
          mkdir -p dist
          R CMD build . --no-build-vignettes --no-manual
          mv ./*.tar.gz dist/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodano-package
          path: dist/*.tar.gz

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
